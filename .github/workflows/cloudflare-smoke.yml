name: Cloudflare smoke test
on:
  push:
    branches: [fix/upload-preflight-free-limits]
    paths: [.github/workflows/cloudflare-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: Generate one test image
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_CONFIRMED: 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import cloudflare_images
          p = Path('smoke.png')
          assert cloudflare_images.generate('Original stylized miniature town with a blue clock tower, sunny day', p), 'Cloudflare generation failed'
          with Image.open(p) as im:
              im.verify()
          print('Cloudflare image verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-smoke-image
          path: smoke.png
