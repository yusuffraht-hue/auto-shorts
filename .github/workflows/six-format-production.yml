name: Eight-format production

on:
  schedule:
    # Alberta Time stays at UTC-6 year-round.
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
    - cron: "0 22 * * *"
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      format:
        description: Episode format
        type: choice
        options: [world, kingdom, town, power, mystery, analysis, showcase, trending]
        required: true
      upload:
        description: Upload and verify one private YouTube video
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  models: read

concurrency:
  group: shorts-${{ github.event_name == 'schedule' && 'scheduled' || github.run_id }}
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || vars.SHORTS_DAILY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      format: ${{ steps.route.outputs.format }}
      slot: ${{ steps.route.outputs.slot }}
      eligible: ${{ steps.render.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve format
        id: route
        env:
          REQUESTED_FORMAT: ${{ inputs.format }}
          CRON: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at')
            export RUN_CREATED_AT
          fi
          python shorts_release.py route
      - name: Install rendering tools
        env:
          FORMAT: ${{ steps.route.outputs.format }}
        run: |
          packages=(ffmpeg fonts-dejavu-core)
          case "$FORMAT" in
            analysis|showcase|trending) ;;
            *) packages+=(blender) ;;
          esac
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::Retries=1 install -y "${packages[@]}"
          pip install -r requirements.txt Pillow
          if [[ "$FORMAT" == showcase ]]; then
            pip install playwright
            python -m playwright install --with-deps chromium
          fi
      - name: Render and verify media
        id: render
        env:
          FORMAT: ${{ steps.route.outputs.format }}
          EDITORIAL_RESERVE_ONLY: ${{ inputs.upload && '1' || '0' }}
          RENDER_CHECK: ${{ inputs.upload && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python shorts_release.py render "$FORMAT"
          if [[ -s out/media-report.json && -s out/youtube-pending.json ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: short-render
          path: |
            out/final.mp4
            out/story.txt
            out/quality-report.json
            out/media-report.json
            out/youtube-pending.json
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: render
    if: >-
      github.run_attempt == 1 && needs.render.outputs.eligible == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.upload) ||
       (github.event_name == 'schedule' && vars.SHORTS_PUBLIC_VERIFIED == 'true'))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: short-render
          path: out
      - run: |
          pip install requests
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          git config user.name auto-shorts-bot
          git config user.email bot@users.noreply.github.com
      - name: Publish once and verify
        env:
          FORMAT: ${{ needs.render.outputs.format }}
          SLOT: ${{ needs.render.outputs.slot }}
          PUBLISH_MODE: ${{ github.event_name == 'schedule' && 'public' || 'canary' }}
          SHORTS_PUBLIC_VERIFIED: ${{ vars.SHORTS_PUBLIC_VERIFIED }}
          LAB_PROMO_PROFILE_LINK_VERIFIED: ${{ vars.LAB_PROMO_PROFILE_LINK_VERIFIED }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_YOUTUBE_ACCOUNT_ID: ${{ vars.COMPOSIO_YOUTUBE_ACCOUNT_ID }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: python shorts_release.py publish "$FORMAT" "$SLOT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-receipt
          path: out/youtube-receipt.json
          retention-days: 7
          if-no-files-found: ignore
