name: in-this-town

on:
  schedule:
    - cron: "0 15 * * *"   # daily 15:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate a test video without uploading or changing episode history"
        type: boolean
        required: false
        default: true

permissions:
  contents: write           # lets the job save episode history
  models: read

concurrency:
  group: in-this-town

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SERIES: town
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core blender
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Make and upload the short
        run: python generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          USE_BLENDER: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: in-this-town
          path: |
            out/final.mp4
            out/story.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Save episode history
        if: success()
        run: |
          git config user.name "auto-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -m "history: ${SERIES}"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
