name: anime-and-novel-stories

on:
  schedule:
    - cron: "30 15 * * *"  # daily 15:30 UTC (30 min after the other series to avoid free-tier rate limits)
  workflow_dispatch:
    inputs:
      format:
        description: "Episode format"
        type: choice
        options: [auto, recap, whatif]
        default: auto
      work:
        description: "Which work"
        type: choice
        options:
          - auto
          - "Jujutsu Kaisen"
          - "Black Clover"
          - "Lord of the Mysteries"
          - "Shadow Slave"
          - "A Regressor's Tale of Cultivation"
          - "The Artist Who Paints Dungeons"
        default: auto
      dry_run:
        description: "Generate a test video without uploading or changing episode history"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: anime-and-novel-stories

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SERIES: anime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Make and upload the short
        run: python generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORMAT: ${{ inputs.format || 'auto' }}
          WORK: ${{ inputs.work || 'auto' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anime-and-novel-stories
          path: |
            out/final.mp4
            out/story.txt
            out/quality-report.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Save episode history
        if: success()
        run: |
          git config user.name "auto-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -m "history: ${SERIES}"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
