name: anime-and-novel-stories

on:
  schedule:
    - cron: "30 15 * * *"  # daily 15:30 UTC (30 min after the other series to avoid free-tier rate limits)
  workflow_dispatch:
    inputs:
      format:
        description: "Episode format"
        type: choice
        options: [auto, recap, whatif]
        default: auto
      work:
        description: "Which work"
        type: choice
        options:
          - auto
          - "Jujutsu Kaisen"
          - "Black Clover"
          - "Lord of the Mysteries"
          - "Shadow Slave"
          - "A Regressor's Tale of Cultivation"
          - "The Artist Who Paints Dungeons"
        default: auto
      dry_run:
        description: "Generate a test video without uploading or changing episode history"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: anime-and-novel-stories

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SERIES: anime
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Make and upload the short
        run: python generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_FREE_CONFIRMED: ${{ vars.CLOUDFLARE_FREE_CONFIRMED || 'false' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
          YOUTUBE_QUEUE_ONLY: ${{ vars.YOUTUBE_QUEUE_ONLY || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          FORMAT: ${{ inputs.format || 'auto' }}
          WORK: ${{ inputs.work || 'auto' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anime-and-novel-stories
          path: |
            out/final.mp4
            out/story.txt
            out/quality-report.json
            out/youtube-pending.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Save episode history
        if: ${{ success() && vars.YOUTUBE_QUEUE_ONLY != 'true' }}
        run: |
          git config user.name "auto-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet && exit 0
          git commit -m "history: ${SERIES}"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
      - name: Host the video for Instagram
        if: ${{ success() && vars.YOUTUBE_QUEUE_ONLY != 'true' && !inputs.dry_run && env.COMPOSIO_API_KEY != '' && vars.INSTAGRAM_POST != '0' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp -d)
          file="${SERIES}-${GITHUB_RUN_ID}.mp4"
          mkdir "$tmp/media" && cp out/final.mp4 "$tmp/media/$file"
          cd "$tmp" && git init -q -b media && git add media
          git -c user.name=auto-shorts-bot -c user.email=bot@users.noreply.github.com commit -qm "media for instagram"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" media:media
          echo "VIDEO_URL=https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/media/media/${file}" >> "$GITHUB_ENV"
      - name: Post the Reel to Instagram (Composio)
        if: ${{ success() && env.VIDEO_URL != '' }}
        continue-on-error: true
        env:
          INSTAGRAM_POST: ${{ vars.INSTAGRAM_POST }}
        run: python post_instagram.py "$VIDEO_URL" out/story.txt
