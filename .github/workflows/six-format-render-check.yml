name: Eight-format render check

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/six-format-*.yml"
      - "blender/**"
      - "editorial*.json"
      - "generate.py"
      - "lab_promo.py"
      - "llm.py"
      - "quality.py"
      - "series.py"
      - "shorts_release.py"
      - "trend_video.py"
      - "web_lab_showcase.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        format: [world, kingdom, town, power, mystery, analysis, showcase, trending]
    env:
      FORMAT: ${{ matrix.format }}
      EDITORIAL_TEST_LATEST: "1"
      RENDER_CHECK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install rendering tools
        run: |
          packages=(ffmpeg fonts-dejavu-core)
          case "$FORMAT" in
            analysis|showcase|trending) ;;
            *) packages+=(blender) ;;
          esac
          sudo apt-get -o Acquire::Retries=1 update
          sudo apt-get -o Acquire::Retries=1 install -y "${packages[@]}"
          pip install -r requirements.txt Pillow
          if [[ "$FORMAT" == showcase ]]; then
            pip install playwright
            python -m playwright install --with-deps chromium
          fi
      - name: Run the complete renderer without credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python shorts_release.py render "$FORMAT"
          if [[ "$FORMAT" == showcase && ! -s out/final.mp4 ]]; then
            python lab_promo.py --sample screenshot-cleaner
            cp out/lab-promo/final.mp4 out/final.mp4
            python -c 'from pathlib import Path; from shorts_release import verify_media; verify_media(Path("out/final.mp4"))'
          fi
          test -s out/final.mp4 && test -s out/media-report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-${{ matrix.format }}
          path: |
            out/final.mp4
            out/story.txt
            out/lab-promo/report.json
            out/quality-report.json
            out/media-report.json
          retention-days: 2
          if-no-files-found: ignore
