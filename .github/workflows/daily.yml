name: daily-short

on:
  schedule:
    - cron: "0 15 * * *"   # once a day, 15:00 UTC. Change as you like.
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  models: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Make and upload the short
        run: python generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional, free: aistudio.google.com/apikey
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # optional, free: console.groq.com
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short
          path: |
            out/final.mp4
            out/story.txt
          retention-days: 7
          if-no-files-found: ignore
