name: blender-test

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y blender ffmpeg
      - name: Render the blocky town (CPU, headless)
        run: |
          blender --version | head -2
          nproc
          mkdir -p frames
          start=$(date +%s)
          blender -b -noaudio -P blender/town.py -- frames 2>&1 | grep -E "Fra:|Time:|Error|Traceback|error" | tail -30
          echo "render seconds: $(( $(date +%s) - start ))"
          ls frames | wc -l
          ffmpeg -y -framerate 12 -i frames/f_%04d.png -c:v libx264 -pix_fmt yuv420p town_test.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blender-test
          path: |
            town_test.mp4
            frames/f_0001.png
            frames/f_0048.png
          if-no-files-found: ignore
